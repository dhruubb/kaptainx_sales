# Render: New → Blueprint → pick this repo. (Or New → Static Site, publish directory: web)
services:
  - type: web
    name: kaptainx-sales-hq
    runtime: static
    buildCommand: echo "no build needed"
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cache-Control
        value: "no-cache"
