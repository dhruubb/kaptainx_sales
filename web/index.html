<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KaptainX Sales HQ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KaptainX">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/sf-regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/sf-medium.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="center"><div class="spinner"></div></div></div>
  <div class="scrim hide" id="scrim"></div>
  <div class="sheet hide" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tip" id="tip"></div>
  <noscript><p style="padding:24px;font-family:system-ui">KaptainX Sales HQ needs JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>

</html>
